[project]
name = "orbital-engine"
version = "0.1.0"
description = "SpaceHawk Orbital Engine — Python/FastAPI domain & compute tier"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Tooling used in Stage 0 to validate the canonical model against the JSON Schema
# contract and the sample catalog, and to exercise the API skeleton.
dev = [
    "jsonschema>=4.21",
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
export-openapi = "orbital_engine.openapi:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbital_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
