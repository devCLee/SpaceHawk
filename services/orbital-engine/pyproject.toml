[project]
name = "orbital-engine"
version = "0.1.0"
description = "SpaceHawk Orbital Engine — Python/FastAPI domain & compute tier"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "redis>=5.0",
    "sgp4>=2.23",
    "celery[redis]>=5.3",
]

[project.optional-dependencies]
# Tooling used in Stage 0 to validate the canonical model against the JSON Schema
# contract and the sample catalog, and to exercise the API skeleton.
dev = [
    "jsonschema>=4.21",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
export-openapi = "orbital_engine.openapi:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbital_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Migrations are framework-shaped; allow their conventional unused imports.
[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["F401"]
